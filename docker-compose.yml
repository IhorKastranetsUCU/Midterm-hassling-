services:
  moodle-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: moodle-connector-portal:latest
    container_name: moodle_portal
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MOODLE_BASE_URL=https://learn.ucu.edu.ua
      - MOODLE_SERVICE_SHORTNAME=moodle_mobile_app
      - MOODLE_MOCK_MODE=false
      - MOODLE_REQUEST_TIMEOUT=20.0
      - SECRET_KEY=change-this-in-production-to-a-random-32-char-key
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - COOKIE_NAME=moodle_session
      - COOKIE_SECURE=false
      - COOKIE_SAMESITE=lax
    env_file:
      - .env
